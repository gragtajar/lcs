name: FTP probe (temporary)

# One-off diagnostics for the production-deploy PR, removed again before it
# merges. The previous preflight showed every .htaccess behaviour working on the
# host except ErrorDocument: missing pages answered the host's 13-byte
# "404 Not Found". This run isolates ErrorDocument in four throwaway folders to
# find out whether the host honours it in any form, then deletes them.

on:
  pull_request:
    paths:
      - .github/workflows/ftp-probe.yml

permissions:
  contents: read

jobs:
  errordocument:
    name: ErrorDocument diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Upload four variants, request a missing page in each, clean up
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -u
          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > "$HOME/.netrc"
          ftp() { curl -sS --netrc --ssl-reqd --insecure --connect-timeout 20 --max-time 90 "$@"; }
          t="$RUNNER_TEMP/v"; mkdir -p "$t"
          printf '<!doctype html><title>lcs custom 404</title><p>custom</p>\n' > "$t/err.html"
          # a: quoted-string ErrorDocument
          printf 'ErrorDocument 404 "lcs-string-404"\n' > "$t/a.htaccess"
          # b: local-path ErrorDocument, nothing else in the file
          printf 'ErrorDocument 404 /lcs-ed-b/err.html\n' > "$t/b.htaccess"
          # c: local path, and the rewrite engine on (as in the real file)
          printf 'RewriteEngine On\nErrorDocument 404 /lcs-ed-c/err.html\n' > "$t/c.htaccess"
          # d: a missing file mapped to the error page by mod_rewrite, status via R=404
          printf 'RewriteEngine On\nRewriteCond %%{REQUEST_FILENAME} !-f\nRewriteCond %%{REQUEST_FILENAME} !-d\nRewriteRule ^ - [R=404,L]\nErrorDocument 404 /lcs-ed-d/err.html\n' > "$t/d.htaccess"
          for v in a b c d; do
            ftp --ftp-create-dirs -T "$t/$v.htaccess" "ftp://$FTP_SERVER/lcs-ed-$v/.htaccess" -o /dev/null
            ftp --ftp-create-dirs -T "$t/err.html" "ftp://$FTP_SERVER/lcs-ed-$v/err.html" -o /dev/null
          done
          ftp --ftp-create-dirs -T "$t/err.html" "ftp://$FTP_SERVER/lcs-ed-e/err.html" -o /dev/null
          sleep 2
          for v in a b c d e; do
            u="https://learncivicsense.in/lcs-ed-$v/missing-$GITHUB_RUN_ID.html"
            body=$(curl -s --max-time 20 "$u" | tr -d '\n' | head -c 120)
            st=$(curl -s -o /dev/null -w '%{http_code} %{size_download}B %{content_type}' --max-time 20 "$u")
            echo "$v: $st :: $body"
            echo "   err.html directly: $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://learncivicsense.in/lcs-ed-$v/err.html")"
          done
          for v in a b c d; do ftp --list-only -Q "DELE lcs-ed-$v/.htaccess" "ftp://$FTP_SERVER/" -o /dev/null 2>/dev/null || true; done
          for v in a b c d e; do
            ftp --list-only -Q "DELE lcs-ed-$v/err.html" "ftp://$FTP_SERVER/" -o /dev/null 2>/dev/null || true
            ftp --list-only -Q "RMD lcs-ed-$v" "ftp://$FTP_SERVER/" -o /dev/null 2>/dev/null || true
          done
          echo "web root now: $(ftp --list-only -X 'NLST -a' "ftp://$FTP_SERVER/" | tr -d '\r' | grep -v '^\.\{1,2\}$' | sort | tr '\n' ' ')"
          rm -f "$HOME/.netrc"
