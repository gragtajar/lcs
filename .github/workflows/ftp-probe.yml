name: FTP probe (temporary)

# One-off preflight for the production-deploy PR, removed again before it
# merges. It installs public/.htaccess in a throwaway folder on the real host
# (/lcs-preflight/, its root-anchored paths rewritten to that folder), checks
# every behaviour the site relies on, and deletes the folder. An .htaccess
# directive this host does not allow would otherwise answer 500 for the whole
# site on the first real deploy.

on:
  pull_request:
    paths:
      - .github/workflows/ftp-probe.yml
      - public/.htaccess

permissions:
  contents: read

jobs:
  preflight:
    name: Apache preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Stage a miniature site with the real .htaccess
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/lcs-preflight"
          mkdir -p "$d/_astro" "$d/pagefind" "$d/sub"
          sed -e 's#m\#\^/#m\#^/lcs-preflight/#g' \
              -e "s#== '/build-info.json'#== '/lcs-preflight/build-info.json'#" \
              -e 's#^ErrorDocument \(40[34]\) /404.html#ErrorDocument \1 /lcs-preflight/404.html#' \
              public/.htaccess > "$d/.htaccess"
          grep -n "lcs-preflight" "$d/.htaccess"
          printf '<!doctype html><title>preflight</title><p>index</p>\n' > "$d/index.html"
          printf '<!doctype html><title>Page not found</title><p>404</p>\n' > "$d/404.html"
          printf '<!doctype html><title>sub</title><p>sub</p>\n' > "$d/sub/index.html"
          printf 'body{color:red}\n' > "$d/_astro/probe.abc123.css"
          printf 'export const x = 1;\n' > "$d/pagefind/pagefind.js"
          printf '{"probe":true}\n' > "$d/build-info.json"
          printf '{"hidden":true}\n' > "$d/.ftp-deploy-sync-state.json"
          ls -la "$d" "$d/_astro"

      - name: Upload, check on the live host, clean up
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -u
          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > "$HOME/.netrc"
          ftp() { curl -sS --netrc --ssl-reqd --insecure --connect-timeout 20 --max-time 90 "$@"; }
          d="$RUNNER_TEMP/lcs-preflight"
          files=(.htaccess index.html 404.html sub/index.html _astro/probe.abc123.css pagefind/pagefind.js build-info.json .ftp-deploy-sync-state.json)
          for f in "${files[@]}"; do
            ftp --ftp-create-dirs -T "$d/$f" "ftp://$FTP_SERVER/lcs-preflight/$f" -o /dev/null || echo "::error::upload failed: $f"
          done
          sleep 2

          fails=0
          B="https://learncivicsense.in/lcs-preflight"
          status() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$@"; }
          header() { curl -s -D - -o /dev/null --max-time 20 "${@:2}" | tr -d '\r' | grep -i "^$1:" | head -1 | cut -d' ' -f2-; }
          expect() { # name actual pattern
            if printf '%s' "$2" | grep -Eq -- "$3"; then echo "ok    $1: $2"; else echo "FAIL  $1: got '$2', want /$3/"; fails=$((fails+1)); fi
          }
          expect "index 200" "$(status "$B/")" '^200$'
          expect "sub/ 200" "$(status "$B/sub/")" '^200$'
          expect "sub (no slash) redirects" "$(status "$B/sub")" '^301$'
          expect "missing page 404" "$(status "$B/nope-$GITHUB_RUN_ID/")" '^404$'
          expect "404 body is ours" "$(curl -s --max-time 20 "$B/nope-$GITHUB_RUN_ID/" | tr -d '\n')" 'Page not found'
          expect "dotfile hidden" "$(status "$B/.ftp-deploy-sync-state.json")" '^404$'
          expect ".htaccess hidden" "$(status "$B/.htaccess")" '^(403|404)$'
          expect "http -> https" "$(header location "http://learncivicsense.in/lcs-preflight/sub/?q=1")" '^https://learncivicsense\.in/lcs-preflight/sub/\?q=1$'
          expect "www -> apex" "$(header location "https://www.learncivicsense.in/lcs-preflight/")" '^https://learncivicsense\.in/lcs-preflight/$'
          expect "nosniff" "$(header x-content-type-options "$B/")" '^nosniff$'
          expect "frame" "$(header x-frame-options "$B/")" '^DENY$'
          expect "referrer" "$(header referrer-policy "$B/")" 'strict-origin-when-cross-origin'
          expect "permissions" "$(header permissions-policy "$B/")" 'camera=\(\)'
          expect "hsts" "$(header strict-transport-security "$B/")" 'max-age=31536000'
          expect "html cache" "$(header cache-control "$B/")" 'max-age=300'
          expect "asset cache" "$(header cache-control "$B/_astro/probe.abc123.css")" 'immutable'
          expect "pagefind cache" "$(header cache-control "$B/pagefind/pagefind.js")" 'max-age=86400'
          expect "build-info cache" "$(header cache-control "$B/build-info.json")" 'no-store'
          expect "js type" "$(header content-type "$B/pagefind/pagefind.js")" 'javascript'
          expect "json type" "$(header content-type "$B/build-info.json")" 'application/json'
          expect "html gzip" "$(header content-encoding "$B/" -H 'Accept-Encoding: gzip')" 'gzip'

          # Clean up: files first, then the folders.
          for f in "${files[@]}"; do ftp --list-only -Q "DELE lcs-preflight/$f" "ftp://$FTP_SERVER/" -o /dev/null 2>/dev/null || true; done
          for dir in lcs-preflight/_astro lcs-preflight/pagefind lcs-preflight/sub lcs-preflight; do ftp --list-only -Q "RMD $dir" "ftp://$FTP_SERVER/" -o /dev/null 2>/dev/null || true; done
          echo "after cleanup, $B/ answers $(status "$B/")"
          echo "web root now: $(ftp --list-only -X 'NLST -a' "ftp://$FTP_SERVER/" | tr -d '\r' | grep -v '^\.\{1,2\}$' | sort | tr '\n' ' ')"
          rm -f "$HOME/.netrc"
          echo "failures: $fails"
          [ "$fails" = 0 ]
