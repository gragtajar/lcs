name: FTP probe (temporary)

# One-off check for the production-deploy PR, removed again before it merges.
# It answers three questions the deploy step depends on, without printing any
# secret or any private path: which FTP transport the host accepts, which
# directory is the site's web root (proved by writing a file over FTP and
# reading it back over HTTPS), and whether the existing content token can also
# read the private lcs-workflow repo.

on:
  pull_request:
    paths:
      - .github/workflows/ftp-probe.yml

permissions:
  contents: read

jobs:
  probe:
    name: FTP probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe FTP transport, web root and token reach
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          set -u
          umask 077
          # Credentials travel in a netrc file, never on a command line.
          printf 'machine %s\nlogin %s\npassword %s\n' "$FTP_SERVER" "$FTP_USERNAME" "$FTP_PASSWORD" > "$HOME/.netrc"

          if [[ "$FTP_SERVER" =~ ^[0-9]+(\.[0-9]+){3}$ ]]; then echo "FTP_SERVER is an IPv4 address"; else echo "FTP_SERVER is a hostname"; fi
          case "$FTP_SERVER" in *://*|*/*|*:*) echo "::warning::FTP_SERVER contains a scheme, path or port; it should be a bare host";; esac

          code() { curl -sS --netrc --connect-timeout 20 --max-time 90 "$@" -o /dev/null 2>/dev/null; echo $?; }
          strict=$(code --ssl-reqd --list-only "ftp://$FTP_SERVER/")
          loose=$(code --ssl-reqd --insecure --list-only "ftp://$FTP_SERVER/")
          plain=$(code --list-only "ftp://$FTP_SERVER/")
          echo "FTPS, certificate verified:     curl exit $strict"
          echo "FTPS, certificate not verified: curl exit $loose"
          echo "Plain FTP:                      curl exit $plain"
          if   [ "$strict" = 0 ]; then MODE=(--ssl-reqd);            echo "=> transport: ftps (strict)"
          elif [ "$loose"  = 0 ]; then MODE=(--ssl-reqd --insecure); echo "=> transport: ftps (loose)"
          elif [ "$plain"  = 0 ]; then MODE=();                      echo "=> transport: ftp (plain)"
          else echo "::error::No FTP transport worked"; exit 1; fi

          ftp() { curl -sS --netrc --connect-timeout 20 --max-time 90 "${MODE[@]}" "$@"; }

          # The login directory: report only whether it holds public_html.
          root=$(ftp --list-only -X 'NLST -a' "ftp://$FTP_SERVER/" | tr -d '\r')
          echo "login directory: $(printf '%s\n' "$root" | grep -cv '^\.\{1,2\}$') entries"
          if printf '%s\n' "$root" | grep -qx 'public_html'; then
            TARGET="public_html/"
            echo "login directory contains public_html/ (a cPanel home directory)"
            echo "--- public_html/ (public web content, names only) ---"
            ftp --list-only -X 'NLST -a' "ftp://$FTP_SERVER/public_html/" | tr -d '\r' | grep -v '^\.\{1,2\}$' | sort
          else
            TARGET=""
            echo "login directory has no public_html/; it is itself the candidate web root"
            echo "--- login directory (names only) ---"
            printf '%s\n' "$root" | grep -v '^\.\{1,2\}$' | sort
          fi

          # Prove the candidate is the directory served at https://learncivicsense.in/.
          token="lcs-probe-$GITHUB_RUN_ID"
          printf '%s\n' "$token" > "$RUNNER_TEMP/probe.txt"
          if ftp -T "$RUNNER_TEMP/probe.txt" "ftp://$FTP_SERVER/${TARGET}lcs-deploy-probe.txt" -o /dev/null; then
            echo "write to ${TARGET:-./}: ok"
            sleep 2
            served=$(curl -s --max-time 20 "https://learncivicsense.in/lcs-deploy-probe.txt" | tr -d '\r\n')
            if [ "$served" = "$token" ]; then echo "=> web root confirmed: server-dir '${TARGET:-./}'"; else echo "::error::the probe file was not served at https://learncivicsense.in/lcs-deploy-probe.txt"; fi
            ftp --list-only -Q "DELE ${TARGET}lcs-deploy-probe.txt" "ftp://$FTP_SERVER/" -o /dev/null && echo "probe file deleted"
            gone=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://learncivicsense.in/lcs-deploy-probe.txt")
            echo "after delete, https status: $gone"
          else
            echo "::error::could not write to ${TARGET:-./}"
          fi
          rm -f "$HOME/.netrc"

          # Can the content token also read the private workflow repo (the publish manifest)?
          for repo in lcs-content lcs-workflow; do
            if git ls-remote "https://x-access-token:${CONTENT_REPO_TOKEN}@github.com/gragtajar/${repo}.git" HEAD >/dev/null 2>&1; then
              echo "CONTENT_REPO_TOKEN can read $repo: yes"
            else
              echo "CONTENT_REPO_TOKEN can read $repo: no"
            fi
          done
